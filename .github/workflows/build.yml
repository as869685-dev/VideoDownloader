name: Build APK

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: APK banao
        working-directory: .github/workflows
        run: gradle assembleDebug

      - name: APK ko Release mein daalo
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Video Downloader build ${{ github.run_number }}
          files: .github/workflows/app/build/outputs/apk/debug/app-debug.apk
