name: Build APK

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # Fixed signing key: file kahin bhi ho, dhoondh lega. Na mile ya kharab ho to build nahi rukega.
      - name: Fixed signing key
        run: |
          mkdir -p ~/.android
          KEY=$(find . -type f -name 'debug-keystore*' | head -n 1)
          if [ -z "$KEY" ]; then
            echo "::warning::debug-keystore.txt nahi mili, is baar naya key banega"
            exit 0
          fi
          echo "Key file mili: $KEY"
          if base64 -d -i "$KEY" > ~/.android/debug.keystore && \
             keytool -list -keystore ~/.android/debug.keystore -storepass android > /dev/null 2>&1; then
            echo "Key sahi hai"
          else
            echo "::warning::debug-keystore.txt ka content sahi nahi hai, is baar naya key banega"
            rm -f ~/.android/debug.keystore
          fi

      - name: APK banao
        working-directory: .github/workflows
        run: gradle assembleDebug

      - name: APK ko Release mein daalo
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Video Downloader build ${{ github.run_number }}
          files: .github/workflows/app/build/outputs/apk/debug/app-debug.apk
